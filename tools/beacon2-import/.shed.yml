categories:
- Variant Analysis
description: Query any GA4GH Beacon v2 conformant resource, and analyse the results.
long_description: |
  A general-purpose client for the GA4GH Beacon v2 API. Query one or many
  federated beacons in a single run, with results combined and tagged by their
  origin, plus a per-provider run report distinguishing "no matches" from
  "never queried". Covers the four genomic query forms (sequence, range,
  bracket, geneId), the entry types (biosamples, individuals, cohorts,
  datasets, runs, analyses), discovery of each beacon's capabilities and filter
  vocabulary, and an analysis layer for segments, per-sample statistics,
  cohort frequencies, matrices and plots. Direct MongoDB access is retained as
  a transport choice for self-hosted beacons.
homepage_url: https://pypi.org/project/beacon2-import/
name: Beacon2_Import
